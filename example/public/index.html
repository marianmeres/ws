<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>@marianmeres/ws — room chat</title>
		<meta
			name="description"
			content="Reference chat client for @marianmeres/ws — namespaces, rooms, presence, acknowledged publishes and reconnect."
		/>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>"
		/>

		<!--
			Styling is @marianmeres/design-tokens with the Bootstrap Reboot bridge:
			  · reboot.css — Bootstrap Reboot element normalize (consumes --bs-*)
			  · theme.css  — one bundled design-tokens theme + the reboot bridge.
			                 Sets --app-color-* AND --bs-*, light on :root and dark
			                 on :root.dark. Generated by example/build-theme.ts.
			  · app.css    — this example's layout, entirely token-driven.
		-->
		<link rel="stylesheet" href="./reboot.css" />
		<link rel="stylesheet" href="./theme.css" />
		<link rel="stylesheet" href="./app.css" />

		<!-- Pick the mode before first paint so a dark-mode visitor sees no flash. -->
		<script>
		try {
			document.documentElement.classList.toggle(
				"dark",
				matchMedia("(prefers-color-scheme: dark)").matches,
			);
		} catch (e) {}
		</script>
	</head>
	<body>
		<!-- The whole UI lives in templates; client/mod.ts clones and wires them. -->

		<template id="tpl-login">
			<form class="login" data-on="submit:submit">
				<h1>💬 ws chat</h1>
				<p class="lead">
					A reference client for
					<a href="https://jsr.io/@marianmeres/ws" target="_blank" rel="noopener"
						>@marianmeres/ws</a
					>: namespaces, rooms, presence, acknowledged publishes and reconnect.
				</p>

				<label>
					<span>Nickname</span>
					<input data-ref="nick" name="nick" autocomplete="off"
						placeholder="alice" />
				</label>

				<label>
					<span>Workspace</span>
					<input
						data-ref="workspace"
						name="workspace"
						autocomplete="off"
						placeholder="acme"
					/>
					<small
					>Becomes the connection's <strong>namespace</strong>. Two workspaces
						can both have a #general and never see each other.</small>
				</label>

				<p class="error" data-ref="error" hidden></p>

				<button type="submit" class="primary">Join</button>

				<p class="hint">
					Open a second window with a <em>different</em> nickname to see presence
					and delivery. <code>server</code>, <code>system</code> and
					<code>admin</code> are refused — the server closes those with a terminal
					<code>4001</code>, and the client stops retrying.
				</p>
			</form>
		</template>

		<template id="tpl-chat">
			<div class="chat">
				<header class="chat-header">
					<div class="identity">
						<strong data-ref="you"></strong>
						<span class="sep">·</span>
						<span class="workspace" data-ref="workspace"></span>
					</div>
					<div class="header-right">
						<span class="status" data-ref="status">idle</span>
						<button type="button" class="ghost" data-on="click:leave">
							Leave
						</button>
					</div>
				</header>

				<aside class="sidebar">
					<nav class="rooms" data-ref="rooms" aria-label="Rooms"></nav>

					<div class="presence">
						<h2>
							Presence <span class="count" data-ref="memberCount"></span>
						</h2>
						<ul class="members" data-ref="members"></ul>
					</div>
				</aside>

				<main class="main">
					<div class="log-wrap">
						<ul class="log" data-ref="log" aria-live="polite"></ul>
						<p class="empty" data-ref="empty" hidden>
							Nothing here yet. Say something.
						</p>
					</div>

					<p class="typing" data-ref="typing"></p>

					<form class="composer" data-on="submit:send">
						<input
							data-ref="input"
							data-on="input:typing"
							autocomplete="off"
							placeholder="Message"
							aria-label="Message"
						/>
						<button type="submit" class="primary"
							data-ref="send">Send</button>
					</form>

					<label class="broadcast">
						<input type="checkbox" data-on="change:toggleBroadcast" />
						<span
						>📣 broadcast to all workspaces —
							<em data-ref="broadcastHint"></em></span>
					</label>

					<p class="room-label">
						in <strong data-ref="roomName"></strong>
					</p>
				</main>
			</div>
		</template>

		<!-- One log line. `data-kind` drives the styling; everything else is
		     one-directional data → DOM through applyBindings. -->
		<template id="tpl-entry">
			<li class="entry">
				<span class="author" data-bind="text:nick; hidden:noAuthor"></span>
				<span class="text" data-bind="text:text"></span>
				<span class="meta">
					<span class="ack" data-bind="text:ack; hidden:noAck"></span>
					<time data-bind="text:when"></time>
				</span>
			</li>
		</template>

		<template id="tpl-member">
			<li data-bind="title:title">
				<span data-bind="text:nick"></span>
				<small data-bind="text:id"></small>
			</li>
		</template>

		<div id="app"></div>

		<!--
			The app. Build it with `deno task example:build` (or example:watch);
			`deno task example` does the build for you before serving.
		-->
		<script type="module" src="./dist/bundle.js"></script>
	</body>
</html>
